&lt;style&gt;
  #baby-letter-gift-reveal {
    --blg-paper: light-dark(#fff9ef, #28241f);
    --blg-letter-paper: light-dark(#fffdf8, #332c25);
    --blg-ink: light-dark(#40362d, #f5ecdd);
    --blg-muted: light-dark(#796c5e, #c5b8a7);
    --blg-mint: light-dark(#e4eee4, #303f36);
    --blg-mint-deep: light-dark(#365a48, #d7e9da);
    --blg-kraft: light-dark(#f0ddbe, #493c2c);
    --blg-caramel: light-dark(#936237, #dfb481);
    --blg-line: light-dark(#d7c8b2, #645441);
    --blg-button: light-dark(#365c49, #c4dfca);
    --blg-button-ink: light-dark(#fffdf5, #203528);
    --blg-disabled: light-dark(#e5e7dd, #3c4037);
    --blg-shadow: light-dark(#705b3b12, #00000024);
    --blg-blue: light-dark(#3475a2, #a9d4f5);
    --blg-blue-surface: light-dark(#e5f1fb, #253a4b);
    --blg-blue-soft: light-dark(#d4e7f6, #344f66);
    --blg-pink: light-dark(#a24b76, #f5b3d0);
    --blg-pink-surface: light-dark(#fbe8f0, #472d3a);
    --blg-pink-soft: light-dark(#f4d6e4, #633e50);
    --blg-confetti-blue: light-dark(#8bbddc, #a9d4f5);
    --blg-confetti-gold: light-dark(#cba765, #ddc38c);
    padding: 26px 12px 22px;
    color: var(--blg-ink);
  }
  #baby-letter-gift-reveal *,
  #baby-letter-gift-reveal *::before,
  #baby-letter-gift-reveal *::after { box-sizing: border-box; }
  #baby-letter-gift-reveal [hidden] { display: none !important; }
  #baby-letter-gift-reveal .blg-phone {
    width: 100%; max-width: 400px; margin: 0 auto; padding: 22px;
    border: 1px solid var(--blg-line); border-radius: 25px;
    background: var(--blg-paper); box-shadow: 0 8px 24px var(--blg-shadow);
    font-family: -apple-system, BlinkMacSystemFont, &quot;Noto Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif;
    font-size: 15px; line-height: 1.65; font-weight: 400;
  }
  #baby-letter-gift-reveal .blg-header { display: flex; align-items: center; gap: 10px; padding-bottom: 22px; }
  #baby-letter-gift-reveal .blg-brand { border: 1px solid var(--blg-caramel); border-radius: 50%; padding: 7px 5px; color: var(--blg-caramel); font-size: 11px; transform: rotate(-7deg); white-space: nowrap; }
  #baby-letter-gift-reveal .blg-edition { font-size: 11px; color: var(--blg-muted); letter-spacing: .04em; }
  #baby-letter-gift-reveal .blg-screen { text-align: center; }
  #baby-letter-gift-reveal .blg-eyebrow { color: var(--blg-caramel); font-size: 12px; margin: 0 0 10px; letter-spacing: .08em; }
  #baby-letter-gift-reveal h2 { margin: 0; color: var(--blg-ink); font-size: 25px; line-height: 1.55; font-weight: 500; letter-spacing: .02em; }
  #baby-letter-gift-reveal .blg-copy { margin: 16px 0 22px; color: var(--blg-muted); font-size: 14px; }
  #baby-letter-gift-reveal .blg-letter { position: relative; margin: 21px 0; padding: 20px 17px; border: 1px solid var(--blg-line); border-radius: 7px; background: var(--blg-letter-paper); text-align: left; box-shadow: 0 5px 15px var(--blg-shadow); }
  #baby-letter-gift-reveal .blg-letter p { margin: 0 0 15px; font-size: 14px; line-height: 1.9; color: var(--blg-ink); }
  #baby-letter-gift-reveal .blg-letter .blg-letter-to { padding-right: 40px; color: var(--blg-caramel); font-weight: 500; }
  #baby-letter-gift-reveal .blg-letter .blg-letter-signature { margin-bottom: 0; text-align: right; color: var(--blg-muted); font-size: 12px; }
  #baby-letter-gift-reveal .blg-letter-symbol { position: absolute; top: 14px; right: 17px; font-size: 27px; line-height: 1.3; }
  #baby-letter-gift-reveal .blg-parcel { display: block; font-size: 96px; line-height: 1.35; }
  #baby-letter-gift-reveal .blg-address { display: block; margin-top: 6px; border-radius: 5px; padding: 6px 12px; background: var(--blg-mint); color: var(--blg-mint-deep); font-size: 12px; }
  #baby-letter-gift-reveal button { font: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  #baby-letter-gift-reveal .blg-primary { display: block; width: 100%; min-height: 50px; padding: 12px 14px; border: 0; border-radius: 13px; background: var(--blg-button); color: var(--blg-button-ink); font-size: 15px; font-weight: 500; }
  #baby-letter-gift-reveal .blg-primary:disabled { background: var(--blg-disabled); color: var(--blg-muted); }

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;baby-letter-gift-reveal&#x27;);
  if (!root || root.dataset.initialized) return;
  root.dataset.initialized = &#x27;true&#x27;;
  const find = selector =&gt; root.querySelector(selector);
  const live = find(&#x27;[data-live]&#x27;);
  const photo = find(&#x27;[data-baby-photo]&#x27;);
  const photoFallback = find(&#x27;[data-photo-fallback]&#x27;);
  const updatePhoto = () =&gt; {
    const loaded = photo.naturalWidth &gt; 0;
    photo.hidden = !loaded;
    photoFallback.hidden = loaded;
  };
  photo.addEventListener(&#x27;load&#x27;, updatePhoto);
  photo.addEventListener(&#x27;error&#x27;, updatePhoto);
  if (photo.complete) updatePhoto();
  const names = { blue: &#x27;藍色玩具組&#x27;, pink: &#x27;粉紅色玩具組&#x27; };
  let selected = null;
  let stage = &#x27;intro&#x27;;
  let sending = false;
  let delivered = false;
  const show = (name, message) =&gt; {
    stage = name;
    root.querySelectorAll(&#x27;[data-screen]&#x27;).forEach(screen =&gt; { screen.hidden = screen.dataset.screen !== name; });
    if (name === &#x27;reveal&#x27;) find(&#x27;[data-screen=&quot;reveal&quot;]&#x27;).classList.add(&#x27;blg-celebrate&#x27;);
    live.textContent = message;
    const next = find(&#x27;[data-screen=&quot;&#x27; + name + &#x27;&quot;] button:not([disabled]):not([hidden])&#x27;);
    if (next) next.focus({ preventScroll: true });
  };
  find(&#x27;[data-action=&quot;start&quot;]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    if (stage === &#x27;intro&#x27;) show(&#x27;choose&#x27;, &#x27;替寶寶挑一份禮物。請選擇藍色或粉紅色玩具組，每組都有兔兔、積木與小球。&#x27;);
  });
  root.querySelectorAll(&#x27;[data-choice]&#x27;).forEach(button =&gt; {
    button.addEventListener(&#x27;click&#x27;, () =&gt; {
      if (stage !== &#x27;choose&#x27;) return;
      selected = button.dataset.choice;
      root.querySelectorAll(&#x27;[data-choice]&#x27;).forEach(option =&gt; {
        const active = option.dataset.choice === selected;
        option.setAttribute(&#x27;aria-pressed&#x27;, String(active));
        option.querySelector(&#x27;.blg-choice-note&#x27;).textContent = active ? &#x27;已選擇 ✓&#x27; : &#x27;選這一組&#x27;;
      });
      find(&#x27;[data-selection]&#x27;).textContent = &#x27;📦 準備裝箱：&#x27; + names[selected];
      const toys = find(&#x27;[data-packed-toys]&#x27;);
      toys.dataset.color = selected;
      toys.hidden = false;
      const next = find(&#x27;[data-action=&quot;pack&quot;]&#x27;);
      next.disabled = false;
      next.textContent = &#x27;放進包裹，準備寄出&#x27;;
      live.textContent = &#x27;已選擇&#x27; + names[selected] + &#x27;，可以放進包裹，也可以改選另一組。&#x27;;
    });
  });
  find(&#x27;[data-action=&quot;pack&quot;]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    if (stage !== &#x27;choose&#x27; || !selected) return;
    find(&#x27;[data-send-toys]&#x27;).dataset.color = selected;
    find(&#x27;[data-chosen-caption]&#x27;).textContent = &#x27;你挑選的&#x27; + names[selected] + &#x27;，已放入包裹。&#x27;;
    show(&#x27;send&#x27;, names[selected] + &#x27;已放入包裹，收件人是寶寶。按下寄出這份禮物，把心意送給寶寶。&#x27;);
  });
  find(&#x27;[data-action=&quot;send&quot;]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    if (stage !== &#x27;send&#x27; || sending) return;
    sending = true;
    const button = find(&#x27;[data-action=&quot;send&quot;]&#x27;);
    button.disabled = true;
    button.textContent = &#x27;禮物正在送往寶寶身邊…&#x27;;
    find(&#x27;[data-shipment]&#x27;).classList.add(&#x27;blg-sending&#x27;);
    find(&#x27;[data-delivery-note]&#x27;).textContent = &#x27;帶著你的心意，出發囉。&#x27;;
    live.textContent = &#x27;禮物已寄出，正在送往寶寶身邊。&#x27;;
    const reducedMotion = window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
    window.setTimeout(() =&gt; {
      delivered = true;
      find(&#x27;[data-shipment]&#x27;).hidden = true;
      find(&#x27;[data-reply-preview]&#x27;).hidden = false;
      find(&#x27;[data-delivery-eyebrow]&#x27;).textContent = &#x27;禮物送達 · 寶寶回信了&#x27;;
      find(&#x27;[data-delivery-heading]&#x27;).textContent = &#x27;寶寶寄來了回信。&#x27;;
      find(&#x27;[data-chosen-caption]&#x27;).textContent = &#x27;你的禮物，寶寶收到了！&#x27;;
      find(&#x27;[data-delivery-note]&#x27;).textContent = &#x27;回信裡，藏著寶寶想告訴你的小祕密。&#x27;;
      button.hidden = true;
      const reply = find(&#x27;[data-action=&quot;reply&quot;]&#x27;);
      reply.hidden = false;
      reply.focus({ preventScroll: true });
      live.textContent = &#x27;寶寶收到禮物了，回信已送達。請打開寶寶的回信。&#x27;;
    }, reducedMotion ? 250 : 1100);
  });
  find(&#x27;[data-action=&quot;reply&quot;]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    if (stage !== &#x27;send&#x27; || !delivered) return;
    show(&#x27;reveal&#x27;, &#x27;寶寶的回信：哈囉，我是男寶寶！禮物收到了，謝謝你，期待和大家見面。&#x27;);
  });
})();
